name: Deploy to production

# Deploys nexofydigital.com on every push to main.
# The live host is Namecheap cPanel; the docroot is a git checkout of this repo,
# so deploy = ff-only git pull on the server (matches the manual runbook).
# Password SSH is used because Namecheap does not authorize keys on this account.
# Credentials live in repo Secrets — never hardcode them here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            set -e
            cd ~/nexofydigital.com
            tar czf ~/nexofy-backup-$(date +%Y%m%d-%H%M%S).tgz -C ~ nexofydigital.com
            # keep only the 5 most recent backups
            ls -1t ~/nexofy-backup-*.tgz 2>/dev/null | tail -n +6 | xargs -r rm -f
            git fetch origin
            git merge --ff-only origin/main
            echo "Deployed HEAD:"
            git log --oneline -1
